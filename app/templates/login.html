{% extends "base.html" %}
{% block title %}{{ _("Log in") }} – {{ app_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ _("Log in") }}</h1>
  <p class="muted">{{ _("Enter your personal code – or scan the QR code on your card.") }}</p>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="login_token" value="{{ login_token }}">
    <label for="code">{{ _("Code") }}</label>
    <input id="code" name="code" class="input code-input" autocomplete="one-time-code"
           autocapitalize="characters" autocorrect="off" spellcheck="false"
           placeholder="K7MX-P3QR" required autofocus>
    <button type="submit" class="btn btn-primary btn-block">{{ _("Log in") }}</button>
  </form>
</section>
{% endblock %}
