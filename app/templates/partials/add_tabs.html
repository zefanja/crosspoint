<nav class="chips" aria-label="{{ _('Card type') }}">
  {% set tabs = [("verse", _("Bible verse"), "/notes/new?notetype=Bible%20Verse"), ("qa", _("Q & A"), "/notes/new?notetype=Basic"), ("text", _("Bible text"), "/notes/bible"), ("apkg", _("Anki deck"), "/import")] %}
  {% for key, label, href in tabs %}
  <a href="{{ href }}{% if deck_id %}{{ '&' if '?' in href else '?' }}deck_id={{ deck_id }}{% endif %}" class="chip{% if key == active_tab %} active{% endif %}"
     {% if key == active_tab %}aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
</nav>
