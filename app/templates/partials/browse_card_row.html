<li class="browserow">
  <a href="/notes/{{ r.note_id }}" class="rowlink{% if r.suspended %} off{% endif %}">
    <span class="row-main">
      <span class="row-title">{{ r.front or _("(empty)") }}</span>
      <span class="row-meta">{{ r.deck }}{% if r.siblings > 1 %} · {{ r.template }}{% endif %}</span>
    </span>
    {% if not r.suspended %}{% include "partials/browse_status.html" %}{% endif %}
  </a>
  {% if editable_names is none or r.deck in editable_names %}
  <form method="post" action="/cards/{{ r.card_id }}/suspend" hx-post="/cards/{{ r.card_id }}/suspend"
        hx-target="closest li" hx-swap="outerHTML" hx-disabled-elt="find button">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="suspended" value="{{ 0 if r.suspended else 1 }}">
    <input type="hidden" name="q" value="{{ q }}">
    <button class="row-action">{{ _("Unsuspend") if r.suspended else _("Suspend") }}</button>
  </form>
  {% endif %}
</li>
