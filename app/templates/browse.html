{% extends "base.html" %}
{% block title %}{{ _("Browse cards") }}{% endblock %}
{% block content %}
<p><a href="/" class="back">‹ {{ _("Decks") }}</a></p>
<form method="get" action="/browse" class="row search-row" role="search"
      hx-get="/browse" hx-target="#results" hx-trigger="input changed delay:300ms from:#q, submit" hx-push-url="true">
  <input type="search" id="q" name="q" class="input" value="{{ q }}" placeholder="{{ _('Search (Anki search syntax)') }}" aria-label="{{ _('Search') }}" autocomplete="off">
  <button class="btn">{{ _("Search") }}</button>
</form>
<div id="results">
  {% include "partials/browse_results.html" %}
</div>
<p class="muted small">{{ _("Examples:") }} <code>John</code>, <code>deck:"{{ _("My cards") }}"</code>, <code>is:due</code>, <code>is:new</code>, <code>is:suspended</code></p>
{% endblock %}
