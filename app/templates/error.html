{% extends "base.html" %}
{% block title %}{{ _("Notice") }} – {{ app_name }}{% endblock %}
{% block body_class %}splash-page{% endblock %}
{% block content %}
<section class="splash">
  <h1 class="splash-title">{{ _("Oops") }}</h1>
  <p class="splash-text">{{ message }}</p>
</section>
<div class="splash-actions"><a href="/" class="btn-go">{{ _("Home") }}</a></div>
{% endblock %}
