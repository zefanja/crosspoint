# Local development: builds the image and mounts ./app for live reload.
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: dev
    environment:
      SECRET_KEY: dev
      BASE_URL: http://localhost:8000
      TZ: Europe/Berlin
      DATA_DIR: /data
    volumes:
      - ./app:/app/app
      - ./data:/data
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
